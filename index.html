<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StemsLab 3D — AI Audio Separation & Pitch Engine</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #08090d;
      color: #f3f4f6;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    .glass-panel {
      background: rgba(18, 20, 29, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-purple { box-shadow: 0 0 25px rgba(168, 85, 247, 0.25); }
    /* Custom Scrollbar for UI */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.4); border-radius: 4px; }
  </style>
</head>
<body class="select-none">

  <!-- 3D CANVAS CONTAINER -->
  <div id="canvas-container"></div>

  <!-- UI OVERLAY LAYER -->
  <div class="relative z-10 w-full h-screen pointer-events-none flex flex-col justify-between p-4 md:p-6">
    
    <!-- HEADER BAR -->
    <header class="flex flex-wrap items-center justify-between gap-4 pointer-events-auto">
      <div class="glass-panel px-4 py-3 rounded-2xl flex items-center gap-3 border-purple-500/20 shadow-xl">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-500 to-rose-500 flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-purple-500/30">
          S
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-extrabold text-lg text-white tracking-wide">StemsLab <span class="text-xs px-2 py-0.5 rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/30 font-mono">3D VISUALIZER</span></h1>
          </div>
          <p class="text-xs text-slate-400">HT-Demucs v4 AI Core & Web Audio DSP Engine</p>
        </div>
      </div>

      <!-- LIVE SYSTEM STATUS -->
      <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-4 text-xs font-mono border-slate-800">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
          <span class="text-emerald-400 font-bold">GPU CUDA ACTIVE</span>
        </div>
        <div class="h-4 w-[1px] bg-slate-800"></div>
        <span class="text-slate-400">Latency: <strong class="text-white">12ms</strong></span>
        <div class="h-4 w-[1px] bg-slate-800"></div>
        <span class="text-slate-400">FPS: <strong id="fps-counter" class="text-purple-400">60</strong></span>
      </div>
    </header>

    <!-- MIDDLE FLOATING HUD: PITCH TRACKER -->
    <div class="self-center md:self-end glass-panel p-4 rounded-2xl w-full max-w-xs border-purple-500/20 shadow-2xl pointer-events-auto transition-all">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-purple-300 flex items-center gap-1.5">
          <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"></path></svg>
          YIN Pitch Worklet
        </span>
        <span id="pitch-cents" class="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30">+3 Cents</span>
      </div>
      
      <div class="space-y-2">
        <div class="flex justify-between items-baseline">
          <span class="text-2xl font-black font-mono text-white" id="pitch-note">A4</span>
          <span class="text-xs font-mono text-slate-400" id="pitch-hz">440.2 Hz</span>
        </div>
        
        <!-- Pitch Accuracy Meter Bar -->
        <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden relative border border-slate-800">
          <div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-white/50 z-10"></div>
          <div id="pitch-bar" class="h-full bg-gradient-to-r from-purple-500 to-emerald-400 transition-all duration-100" style="width: 52%; margin-left: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- BOTTOM CONTROLS & STEM TOGGLES -->
    <footer class="flex flex-col md:flex-row items-center justify-between gap-4 pointer-events-auto">
      
      <!-- STEM ISOLATION CONTROLS -->
      <div class="glass-panel p-2 rounded-2xl flex flex-wrap items-center gap-2 border-slate-800/80 w-full md:w-auto justify-center">
        
        <!-- Vocals Toggle -->
        <button id="btn-vocals" onclick="toggleStem('vocals')" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-purple-600/30 border border-purple-500/60 text-purple-200 text-xs font-bold transition hover:bg-purple-600/50 shadow-lg">
          <span class="w-2.5 h-2.5 rounded-full bg-purple-400"></span>
          Vocals Stem
        </button>

        <!-- Drums Toggle -->
        <button id="btn-drums" onclick="toggleStem('drums')" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-emerald-600/30 border border-emerald-500/60 text-emerald-200 text-xs font-bold transition hover:bg-emerald-600/50">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
          Drums Stem
        </button>

        <!-- Bass Toggle -->
        <button id="btn-bass" onclick="toggleStem('bass')" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-amber-600/30 border border-amber-500/60 text-amber-200 text-xs font-bold transition hover:bg-amber-600/50">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
          Bass Stem
        </button>

        <!-- Accompaniment Toggle -->
        <button id="btn-other" onclick="toggleStem('other')" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-cyan-600/30 border border-cyan-500/60 text-cyan-200 text-xs font-bold transition hover:bg-cyan-600/50">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
          Other / Music
        </button>
      </div>

      <!-- MAIN ACTION SIMULATOR -->
      <div class="flex items-center gap-3 w-full md:w-auto">
        <button onclick="triggerSeparation()" class="w-full md:w-auto px-6 py-3 rounded-2xl bg-gradient-to-r from-purple-600 via-indigo-600 to-rose-600 text-white font-extrabold text-xs tracking-wider uppercase shadow-xl hover:opacity-90 transition transform active:scale-95 flex items-center justify-center gap-2 glow-purple">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          Simulate AI Separation
        </button>
      </div>

    </footer>
  </div>

  <!-- THREE.JS 3D ENGINE SCRIPT -->
  <script>
    // --- SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x08090d, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;
    controls.minDistance = 10;
    controls.maxDistance = 50;

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const lights = [
      { color: 0xa855f7, pos: [15, 10, 15] },
      { color: 0x10b981, pos: [-15, -10, -15] },
      { color: 0xf59e0b, pos: [0, 15, -15] },
      { color: 0x06b6d4, pos: [-15, 15, 15] }
    ];

    lights.forEach(l => {
      const pLight = new THREE.PointLight(l.color, 2, 50);
      pLight.position.set(...l.pos);
      scene.add(pLight);
    });

    // --- STEM OBJECTS (CONCENTRIC 3D RINGS & PARTICLES) ---
    const stemsGroup = new THREE.Group();
    scene.add(stemsGroup);

    // Stem Data Definitions
    const stemConfigs = {
      vocals: { radius: 5, color: 0xa855f7, speed: 0.02, heightMultiplier: 1.5 },
      drums:  { radius: 8, color: 0x10b981, speed: 0.04, heightMultiplier: 0.8 },
      bass:   { radius: 11, color: 0xf59e0b, speed: 0.015, heightMultiplier: 2.0 },
      other:  { radius: 14, color: 0x06b6d4, speed: 0.025, heightMultiplier: 1.1 }
    };

    const stemMeshes = {};
    const stemActive = { vocals: true, drums: true, bass: true, other: true };

    // Helper to generate dynamic frequency wave ring
    function createStemRing(key, config) {
      const geometry = new THREE.BufferGeometry();
      const count = 180;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const baseColor = new THREE.Color(config.color);

      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        positions[i * 3] = Math.cos(angle) * config.radius;
        positions[i * 3 + 1] = 0;
        positions[i * 3 + 2] = Math.sin(angle) * config.radius;

        colors[i * 3] = baseColor.r;
        colors[i * 3 + 1] = baseColor.g;
        colors[i * 3 + 2] = baseColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      // Particle Points Ring
      const pMaterial = new THREE.PointsMaterial({
        size: 0.35,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      });

      const points = new THREE.Points(geometry, pMaterial);

      // Solid Wave Tube Overlay
      const tubeGeo = new THREE.TorusGeometry(config.radius,
